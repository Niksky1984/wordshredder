<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Word Shredder">
<meta name="theme-color" content="#0b1722">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>Word Shredder</title>
<style>
:root{
  --bg:#0b1722; --bg2:#10202f; --surface:#14283a; --surface2:#1c3449; --line:rgba(255,255,255,.1);
  --text:#f6f1e7; --muted:#9db3c4; --faint:#62798c;
  --gold:#e9a85a; --gold2:#ffe2ae; --red:#d8473f; --red2:#a8262a; --pine:#2f7d57; --mint:#7fe0b0; --bad:#ff9aa6;
  --serif: ui-serif, "Iowan Old Style", Georgia, "Times New Roman", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:22px; --st: env(safe-area-inset-top,0px); --sb: env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overscroll-behavior:none}
body{background:linear-gradient(180deg,#17344d 0%,#10202f 45%,var(--bg) 100%) fixed;-webkit-font-smoothing:antialiased;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.hidden{display:none!important}
h1,h2,h3{margin:0;font-weight:700}
.kicker{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* falling snow. App: drawn flake by flake on a canvas (see snow() in app.js). Admin page: simple drifting dots. */
canvas#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}   /* in front of the cards (taps go through), behind the tab bar and sessions */
div#snow{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.5;
  background-image:radial-gradient(#fff 1.3px,transparent 1.8px),radial-gradient(#fff 1px,transparent 1.5px),radial-gradient(#fff 1.8px,transparent 2.4px);
  background-size:64px 78px,96px 110px,170px 190px;animation:snow 16s linear infinite}
@keyframes snow{from{background-position:0 0,30px 20px,60px 0}to{background-position:26px 156px,-18px 240px,20px 190px}}
@media (prefers-reduced-motion:reduce){div#snow{animation:none}}

/* ---------- layout ---------- */
#views{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--st) + 16px) 16px calc(var(--sb) + 96px);z-index:2}
.view{display:none;max-width:560px;margin:0 auto;animation:rise .3s ease}
.view.active{display:block}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:8px 6px calc(var(--sb) + 6px);background:rgba(11,23,34,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:5}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;color:var(--faint);padding:4px 0}
#tabbar button b{font-size:21px;line-height:1;filter:grayscale(1) opacity(.6)}
#tabbar button.on{color:var(--gold2)}
#tabbar button.on b{filter:none}
.v-head{margin:4px 0 14px}
.v-head h1{font-family:var(--serif);font-size:31px;letter-spacing:-.01em;margin-top:4px}
.panel{background:rgba(20,40,58,.86);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;border-radius:18px;font-weight:800;font-size:17px;color:#fff;background:linear-gradient(135deg,#e2574e,var(--red) 50%,var(--red2));box-shadow:0 10px 26px -10px rgba(216,71,63,.8)}
.primary.gold{color:#3a2208;background:linear-gradient(135deg,var(--gold2),var(--gold));box-shadow:0 10px 26px -10px rgba(233,168,90,.7)}
.primary:active{transform:scale(.98)}
.primary[disabled]{opacity:.45;box-shadow:none}
.ghost{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;border-radius:15px;font-weight:700;background:var(--surface2);border:1px solid var(--line)}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.1);white-space:nowrap}
.pill.ok{background:var(--pine);color:#eafff3}.pill.wait{background:#c98a2b;color:#2a1700}.pill.no{background:#7a3038;color:#ffe3e6}.pill.dim{color:var(--muted)}

/* placeholder that marks where the user's own media goes */
.ph{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:3px;border-radius:16px;border:2px dashed rgba(255,226,174,.5);background:repeating-linear-gradient(135deg,rgba(255,226,174,.07) 0 12px,rgba(255,226,174,.02) 12px 24px);color:var(--gold2);padding:8px;overflow:hidden}
.ph b{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
.ph span{font-size:11px;color:var(--muted);line-height:1.3}
.media{border-radius:16px;overflow:hidden;background:#0c1620}
.media img,.media video{width:100%;height:100%;object-fit:cover;display:block}
.r169{aspect-ratio:16/9}.r11{aspect-ratio:1/1}
.r169>.ph,.r169>.media,.r11>.ph,.r11>.media{width:100%;height:100%}

/* ---------- home ---------- */
.h-top{display:flex;justify-content:space-between;align-items:flex-start;margin:2px 0 12px}
.h-top h1{font-family:var(--serif);font-size:32px;line-height:1.05;margin-top:4px}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.avatar{width:60px;height:60px;flex:none;border-radius:50%;overflow:hidden;border:2px solid var(--gold);box-shadow:0 0 0 3px rgba(233,168,90,.18),0 8px 18px -8px rgba(0,0,0,.7);background:#16324a;display:grid;place-items:center;font-size:30px;position:relative}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.empty{border-style:dashed;font-size:9px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--gold2);line-height:1.15;text-align:center}
.av-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:6px 0 14px}
.av-grid button{aspect-ratio:1;border-radius:50%;overflow:hidden;border:2px solid transparent;background:#16324a;font-size:26px}
.av-grid button.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(233,168,90,.25)}
.av-grid img{width:100%;height:100%;object-fit:cover;display:block}
.streak{padding:7px 12px;border-radius:999px;background:rgba(20,40,58,.86);border:1px solid var(--line);font-weight:800;font-size:13.5px;white-space:nowrap}
.lights{display:flex;justify-content:space-between;margin:-2px 4px 12px;height:10px}
.lights i{width:9px;height:9px;border-radius:50%;animation:tw 2.4s ease-in-out infinite}
.lights i:nth-child(4n+1){background:#ff5d5d;box-shadow:0 0 8px #ff5d5d}.lights i:nth-child(4n+2){background:#ffd166;box-shadow:0 0 8px #ffd166;animation-delay:.6s}
.lights i:nth-child(4n+3){background:#6fe3a5;box-shadow:0 0 8px #6fe3a5;animation-delay:1.2s}.lights i:nth-child(4n){background:#6fb8ff;box-shadow:0 0 8px #6fb8ff;animation-delay:1.8s}
@keyframes tw{50%{opacity:.35}}
.slots{display:flex;gap:8px;margin-top:10px}
.slot{flex:1;border-radius:14px;padding:9px 4px 8px;text-align:center;font-size:11px;font-weight:700;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted)}
.slot b{display:block;font-size:20px;line-height:1.2}
.slot small{display:block;font-weight:600;font-size:10px;margin-top:1px;opacity:.85}
.slot.done{background:rgba(47,125,87,.35);border-color:#52b788;color:#dff7ea}
.slot.open{border-color:var(--gold);color:var(--gold2);box-shadow:0 0 0 2px rgba(233,168,90,.18)}
.slot.missed{background:rgba(122,48,56,.35);border-color:#a8454f;color:#ffd9dd}
.row{display:flex;gap:12px;align-items:center}
.row .ico{font-size:28px;flex:none}
.row .tx{flex:1;min-width:0;font-size:13px;color:var(--muted);line-height:1.35}
.row .tx b{display:block;color:var(--text);font-size:15px}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--red),var(--gold2))}
.lvl-art{width:58px;height:58px;flex:none;border-radius:14px;overflow:hidden}
.lvl-art .ph{width:100%;height:100%;border-radius:14px;padding:2px}.lvl-art .ph b{font-size:8px}.lvl-art .ph span{display:none}
.lvl-art img{width:100%;height:100%;object-fit:cover}

/* ---------- rewards ---------- */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;font-size:10.5px;color:var(--muted);margin-top:10px}
.wk .d{background:rgba(255,255,255,.05);border-radius:10px;padding:6px 0 5px;border:1px solid transparent}
.wk .d.today{border-color:var(--gold)}
.dots{display:flex;justify-content:center;gap:2px;margin-top:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:#3b5165}
.dots i.g{background:#52b788}.dots i.x{background:#d8473f}.dots i.o{background:var(--gold)}
.rw{display:flex;gap:12px;align-items:center}
.rw .anim{width:74px;height:74px;flex:none}
.rw .anim .ph{width:100%;height:100%;padding:3px}.rw .anim .ph b{font-size:8.5px}.rw .anim .ph span{font-size:8.5px}
.rw .tx{flex:1;min-width:0;font-size:12.5px;color:var(--muted);line-height:1.35}
.rw .tx b{display:block;color:var(--text);font-size:15px}
.rw .tx em{color:var(--gold2);font-style:normal;font-weight:700}
.hist{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.hist:last-child{border:0}

/* ---------- progress / words ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:rgba(20,40,58,.86);border:1px solid var(--line);border-radius:18px;padding:12px}
.stat b{font-size:26px;font-family:var(--serif)}.stat span{display:block;font-size:12px;color:var(--muted)}
.road{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.node{text-align:center;font-size:11px;color:var(--muted);font-weight:600}
.node .art{aspect-ratio:1;border-radius:16px;overflow:hidden;margin-bottom:5px;position:relative}
.node .art .ph{width:100%;height:100%}.node .art img{width:100%;height:100%;object-fit:cover}
.node.locked{opacity:.45}.node.cur .art{box-shadow:0 0 0 2px var(--gold)}
.node.done .art:after{content:"✓";position:absolute;right:6px;top:4px;font-weight:900;color:var(--mint)}
.wrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.wrow:last-child{border:0}
.wrow .tx{flex:1;min-width:0}.wrow .tx b{display:block;font-size:15.5px;font-family:var(--serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .tx span{font-size:12.5px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pips{display:flex;gap:4px}.pips i{width:16px;height:6px;border-radius:9px;background:rgba(255,255,255,.14)}.pips i.on{background:linear-gradient(90deg,var(--red),var(--gold2))}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:3px;gap:2px;margin-bottom:12px}
.seg button{flex:1;height:34px;border-radius:11px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--surface2);color:var(--text)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);font-weight:600;font-size:15px}
.set-row:last-child{border:0}
.set-row select{background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:12px;height:40px;padding:0 10px;font-size:15px;max-width:60%}
.hint{font-size:12.5px;color:var(--muted);font-weight:400;margin-top:3px;line-height:1.4}
.foot{text-align:center;font-size:12px;color:var(--faint);margin:18px 0 6px}

/* ---------- session ---------- */
#session{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:linear-gradient(180deg,#17344d 0%,#10202f 50%,var(--bg) 100%);padding:calc(var(--st) + 8px) 12px calc(var(--sb) + 10px)}
.s-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none;height:44px}
.s-x{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:17px}
.s-time{font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.s-count{font-size:13px;color:var(--muted);text-align:right;min-width:74px}.s-count b{color:var(--text);font-size:16px}
.abar{height:6px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;margin:8px 0 8px;flex:none}
.abar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--mint),var(--gold2));transform-origin:left}
.abar i.low{background:linear-gradient(90deg,#ff6b6b,#ffb199)}
.s-stage{flex:1;min-height:0;display:flex;flex-direction:column}
.tcard{flex:1;min-height:0;border-radius:24px;border:1px solid var(--line);background:rgba(20,40,58,.9);padding:14px 14px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;overflow:hidden;position:relative}
.tcard>*{flex-shrink:0}
.t-kick{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--gold2)}
.t-q{font-family:var(--serif);font-size:clamp(24px,7.4vw,38px);line-height:1.12;word-break:break-word}
.t-q.sm{font-size:clamp(19px,5.6vw,26px)}
.t-sub{font-size:14px;color:var(--muted);margin-top:-4px}
.t-pic{flex-shrink:1;min-height:48px;height:min(20vh,150px);max-width:70%;aspect-ratio:4/3;border-radius:14px;object-fit:cover}
.t-speak{width:64px;height:64px;border-radius:50%;background:rgba(233,168,90,.16);color:var(--gold2);font-size:28px}
.t-in{width:100%;min-height:52px;border-radius:15px;border:1.5px solid rgba(233,168,90,.55);background:rgba(255,255,255,.05);font-family:var(--serif);font-size:21px;line-height:1.25;padding:10px 12px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;word-break:break-word}
.t-in .caret{display:inline-block;width:2px;height:1.1em;background:var(--gold2);margin-left:1px;animation:blink 1s steps(1) infinite;vertical-align:-3px}
.t-in .phd{color:var(--faint)}
@keyframes blink{50%{opacity:0}}
.t-in.ok{border-color:var(--mint);background:rgba(127,224,176,.14)}.t-in.no{border-color:var(--bad);background:rgba(255,120,140,.12);animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.opt{min-height:54px;padding:8px 6px;border-radius:14px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);font-weight:700;font-size:15px;line-height:1.2;transition:transform .1s}
.opt:active{transform:scale(.95)}
.opt.ok{background:rgba(127,224,176,.22);border-color:var(--mint)}.opt.no{background:rgba(255,120,140,.2);border-color:var(--bad);animation:shake .35s}.opt.dim{opacity:.35}
.tiles{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;width:100%}
.tile{padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.14);font-weight:700;font-size:16px}
.tile.used{opacity:.22}
.built{width:100%;min-height:56px;border-radius:15px;border:1.5px dashed rgba(233,168,90,.55);padding:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.built .tile{background:rgba(233,168,90,.18);border-color:var(--gold)}
.built.ok{border-style:solid;border-color:var(--mint)}.built.no{border-style:solid;border-color:var(--bad);animation:shake .35s}
/* own keyboard: no autocorrect, no suggestions, no paste, no voice typing */
.kb{flex:none;padding-top:8px;display:flex;flex-direction:column;gap:6px}
.kb .kr{display:flex;gap:4px;justify-content:center}
.kb button{flex:1;max-width:42px;height:46px;border-radius:9px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.1);font-size:18px;font-weight:600;text-transform:lowercase}
.kb button:active{background:rgba(233,168,90,.4)}
.kb button.w{flex:1.6;max-width:66px;font-size:15px}
.kb button.sp{flex:5;max-width:none;font-size:13px;color:var(--muted)}
.kb button.go{flex:2.4;max-width:none;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#3a2208;font-weight:800;font-size:15px;text-transform:none}
/* result */
.chip{font-weight:800;font-size:13px;padding:6px 12px;border-radius:99px}
.chip.up{background:var(--pine);color:#eafff3}.chip.down{background:#8d2f3a;color:#ffe3e6}.chip.win{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#3a2208}
.r-en{font-family:var(--serif);font-size:clamp(24px,7vw,34px);line-height:1.12;word-break:break-word}
.r-ru{font-size:18px;color:var(--gold2);font-weight:600}
.r-ex{font-size:14.5px;color:#cfdbe5;font-style:italic;font-family:var(--serif);line-height:1.4}
.r-ex mark{background:none;color:var(--gold2);font-weight:700;font-style:normal}
.r-yours{font-size:13.5px;color:var(--bad)}
.react{flex:none;margin-top:8px;position:relative;width:100%;border-radius:18px;overflow:hidden;display:block}
.react .lbl{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 8px;font-weight:800;font-size:16px;background:linear-gradient(transparent,rgba(6,12,18,.85));text-align:center}
.react .ph{width:100%;height:100%;border-radius:18px}
.react.r-h{height:min(22vh,150px)}
.react.r-h .media,.react.r-h .ph{position:absolute;inset:0}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(5,10,16,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.scrim.center{align-items:center}
.dlg{width:100%;max-width:420px;background:#12263a;border:1px solid var(--line);border-radius:24px;padding:20px;text-align:center}
.dlg h2{font-family:var(--serif);font-size:24px;margin-bottom:8px}
.dlg p{color:var(--muted);margin:0 0 16px;line-height:1.45;font-size:14.5px}
.btn-row{display:flex;gap:10px}
#toast{position:fixed;left:50%;bottom:calc(var(--sb) + 104px);transform:translateX(-50%) translateY(16px);opacity:0;background:#213a52;border:1px solid rgba(255,255,255,.16);padding:11px 16px;border-radius:14px;font-weight:700;font-size:14px;transition:.3s;z-index:60;pointer-events:none;max-width:82vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ---------- irregular verbs ---------- */
.vf{width:100%;display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;text-align:left}
.vf-l{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.vf .t-in{min-height:46px;font-size:19px;border-color:rgba(255,255,255,.16);justify-content:flex-start}
.vf .t-in.on{border-color:var(--gold);background:rgba(233,168,90,.1)}
.vsets{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:12px}
.vsets button{height:50px;border-radius:13px;background:rgba(20,40,58,.86);border:1px solid var(--line);font-weight:800;font-size:16px;line-height:1.05}
.vsets button small{display:block;font-size:10px;color:var(--muted);font-weight:700}
.vsets button.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(233,168,90,.2)}
.vsets button.full{background:rgba(47,125,87,.35);border-color:#52b788}
.vrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.vrow:last-child{border:0}

<script>
'use strict';
/* =========================================================
   Shared by the app and the admin page: rules, schedule and reward maths.
   Both must calculate exactly the same way.
   Needs globals: CFG (rules), LOG (sessions), peakLearned(), peakVerbs() and clock().
   ========================================================= */
const DATA_REPO = 'wordshredder-data';                    // private repo: rules.json (signed by Dad) + log/
const DEFAULT_LEVEL_NAMES = ['Rental Boots', 'Bunny Slope Tourist', 'Falls Off the Lift', 'Hot Chocolate Enthusiast', 'Accidentally Went Down a Blue',
  'Carves Occasionally', 'Knows What Wax Is', 'Red Run Regular', 'Chairlift Philosopher', 'Powder Hound',
  'Black Diamond, Allegedly', 'Off-Piste Menace', 'Avalanche Whisperer', "Santa's Snowboard Instructor", 'Legend of the Lodge'];
const LEVELS = DEFAULT_LEVEL_NAMES.length;               // 15
const CFG_DEFAULT = {
  v: 0,                   // version: goes up every time Dad saves
  name: 'Dobrynia',
  slots: [{ from: '07:00', to: '12:00' }, { from: '12:00', to: '17:00' }, { from: '17:00', to: '21:30' }],
  minutes: 10,            // session length
  minCorrect: 15,         // correct answers needed for a session to count
  target: 5,              // correct tests to learn an item
  missPenalty: 3,         // points lost on a miss
  perLevel: 30,           // learned items per level
  verbMinutes: 5,         // length of an irregular-verb practice (its own button, its own score)
  verbActive: 6,          // verbs in rotation at a time in verb practice, in order
  time: { choose: 9, type: 10, perChar: 1.6, order: 8, perWord: 2.5, hear: 6 },   // seconds
  rewards: [
    { id: 'r-week', title: 'Perfect week', text: 'Reward: set by Dad', rule: { type: 'perfect_week' } },
    { id: 'r-extra', title: 'Extra mile', text: 'Reward: set by Dad', rule: { type: 'extra', n: 3 } },
    { id: 'r-words', title: 'Every 30 words learned', text: 'Reward: set by Dad', rule: { type: 'words', n: 30 } },
  ],
  paid: {},               // rewardKey -> time Dad tapped "Payment done"
  coinOk: {},             // rewardKey -> coins Dad approved (rewards set to "needs my approval")
  coinNo: {},             // rewardKey -> time Dad declined the coins
  bank: [],               // coins Dad added (+) or took (−) by hand: {id, at, amount, note}
  wd: {},                 // withdrawal requests Dad decided: id -> {ok, at, amount}
  weather: null,          // snow settings; null = WEATHER_DEFAULT
};
const RULE_TYPES = {
  daily: { label: 'Perfect day: every session of the day', n: false },
  session: { label: 'Every session that counts', n: false },
  vsession: { label: 'Every finished verb practice', n: false },
  perfect_week: { label: 'Perfect week: every session, all 7 days', n: false },
  extra: { label: 'Extra sessions in one week', n: 'How many extra sessions' },
  words: { label: 'Every N items learned', n: 'N items' },
  verbs: { label: 'Every N irregular verbs learned', n: 'N verbs' },
  streak: { label: 'Perfect days in a row', n: 'How many days' },
  manual: { label: 'Special: I give it by hand', n: false },
};

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
const norm = s => String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
const ymd = (d = clock()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const hm = s => { const [h, m] = String(s).split(':').map(Number); return h * 60 + (m || 0); };
const nowMin = (d = clock()) => d.getHours() * 60 + d.getMinutes();
const addDays = (d, n) => { const x = new Date(d + 'T12:00'); x.setDate(x.getDate() + n); return ymd(x); };

/* ---------- schedule ---------- */
const slotName = s => { const m = hm(s.from); return m < 12 * 60 ? 'Morning' : m < 17 * 60 ? 'Day' : 'Evening'; };
const slotIcon = s => { const m = hm(s.from); return m < 12 * 60 ? '☀️' : m < 17 * 60 ? '🏂' : '🌙'; };
const sessOn = d => LOG.filter(x => x.day === d && x.ok && x.kind !== 'verbs');   // verb practice never fills a word slot
// How many sessions were scheduled on a day. Past days keep the number that applied then, even if Dad changed the schedule later.
const slotsOn = d => { const rec = LOG.find(x => x.day === d && x.slots && x.kind !== 'verbs'); return d < ymd() && rec ? rec.slots : CFG.slots.length; };
// status of every slot on a given day: done / open (now) / later / missed
function dayStatus(d = ymd(), now = clock()) {
  const today = ymd(now), done = new Set(sessOn(d).filter(x => x.slot >= 0).map(x => x.slot));
  return Array.from({ length: slotsOn(d) }, (_, i) => {
    if (done.has(i)) return 'done';
    if (d < today) return 'missed';
    if (d > today) return 'later';
    const s = CFG.slots[i], m = nowMin(now);
    return !s ? 'missed' : m < hm(s.from) ? 'later' : m <= hm(s.to) ? 'open' : 'missed';
  });
}
const openSlot = (now = clock()) => dayStatus(ymd(now), now).indexOf('open');
const extrasOn = d => sessOn(d).filter(x => x.slot < 0).length;
const perfectDay = d => { const s = dayStatus(d); return s.length > 0 && s.every(x => x === 'done'); };
function mondayOf(d = clock()) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function weekDays(mon = mondayOf()) { return Array.from({ length: 7 }, (_, i) => { const x = new Date(mon); x.setDate(mon.getDate() + i); return ymd(x); }); }
const firstDay = () => LOG.length ? LOG.reduce((m, x) => x.day < m ? x.day : m, ymd()) : ymd();
// every run of perfect days: [{start, len}], oldest first; the last one may still be running
function perfectRuns() {
  const runs = []; let cur = null;
  for (let d = firstDay(); d <= ymd(); d = addDays(d, 1)) {
    if (perfectDay(d)) { if (cur) cur.len++; else runs.push(cur = { start: d, len: 1 }); }
    else if (d < ymd()) cur = null;                       // today not perfect yet does not break the run
  }
  return runs;
}
function streakDays() { const r = perfectRuns().at(-1); return r && addDays(r.start, r.len) >= ymd() ? r.len : 0; }

/* ---------- rewards ---------- */
// For one reward: progress now + every earned instance {key,label}. Keys never change, so "paid" marks stay attached.
function rewardState(r) {
  const t = r.rule?.type, n = Math.max(1, r.rule?.n || 1), out = { cur: '', pct: 0, status: 'progress', earned: [] };
  if (t === 'perfect_week' || t === 'extra') {
    for (let mon = mondayOf(new Date(firstDay() + 'T12:00')); mon <= mondayOf(); mon.setDate(mon.getDate() + 7)) {
      const days = weekDays(mon), isCur = ymd(mon) === ymd(mondayOf()), label = `week of ${days[0].slice(8)}.${days[0].slice(5, 7)}`;
      if (t === 'perfect_week') {
        const st = days.flatMap(d => dayStatus(d)), done = st.filter(s => s === 'done').length, missed = st.filter(s => s === 'missed').length;
        if (st.length && done === st.length) out.earned.push({ key: `${r.id}@${days[0]}`, label });
        if (isCur) { out.cur = `${done} of ${st.length} sessions`; out.pct = st.length ? done / st.length : 0; out.status = done === st.length ? 'earned' : missed ? 'lost' : 'progress'; if (missed) out.cur += ` · ${missed} missed`; }
      } else {
        const ex = days.reduce((a, d) => a + extrasOn(d), 0);
        if (ex >= n) out.earned.push({ key: `${r.id}@${days[0]}`, label });
        if (isCur) { out.cur = `${Math.min(ex, n)} of ${n} extra sessions this week`; out.pct = Math.min(1, ex / n); out.status = ex >= n ? 'earned' : 'progress'; }
      }
    }
  } else if (t === 'daily') {
    const today = ymd();
    for (let d = firstDay(); d <= today; d = addDays(d, 1)) if (perfectDay(d)) out.earned.push({ key: `${r.id}@${d}`, label: `perfect day ${d.slice(8)}.${d.slice(5, 7)}`, at: new Date(d + 'T23:00').getTime() });
    const st = dayStatus(today), done = st.filter(x => x === 'done').length;
    out.cur = `${done} of ${st.length} sessions today`; out.pct = st.length ? done / st.length : 0; out.status = st.includes('missed') ? 'lost' : done === st.length ? 'earned' : 'progress';
  } else if (t === 'session' || t === 'vsession') {
    const vb = t === 'vsession', list = LOG.filter(x => x.ok && (x.kind === 'verbs') === vb);
    for (const x of list) out.earned.push({ key: `${r.id}@${x.id}`, label: `${vb ? 'verb practice' : 'session'} ${x.day.slice(8)}.${x.day.slice(5, 7)} ${new Date(x.end).toTimeString().slice(0, 5)}`, at: x.end });
    const today = list.filter(x => x.day === ymd()).length; out.cur = `${today} today`; out.pct = 0;
  } else if (t === 'words') {
    const L = peakLearned(), got = Math.floor(L / n);
    for (let k = 1; k <= got; k++) out.earned.push({ key: `${r.id}@${k * n}`, label: `${k * n} learned` });
    out.cur = `${L % n} of ${n} to the next one`; out.pct = (L % n) / n;
  } else if (t === 'verbs') {
    const L = peakVerbs(), got = Math.floor(L / n);
    for (let k = 1; k <= got; k++) out.earned.push({ key: `${r.id}@${k * n}`, label: `${k * n} verbs learned` });
    out.cur = `${L % n} of ${n} verbs to the next one`; out.pct = (L % n) / n;
  } else if (t === 'streak') {
    for (const run of perfectRuns()) for (let k = 1; k <= Math.floor(run.len / n); k++) out.earned.push({ key: `${r.id}@${run.start}#${k}`, label: `${n} perfect days from ${addDays(run.start, (k - 1) * n).slice(5)}` });
    const s = streakDays(); out.cur = `${s % n} of ${n} perfect days in a row`; out.pct = (s % n) / n;
  } else if (t === 'manual') {
    for (const g of r.granted || []) out.earned.push({ key: `${r.id}@${g.at}`, label: g.note || 'special' });
    out.cur = 'Given by Dad'; out.pct = 0; out.status = 'manual';
  }
  return out;
}
const paidAt = key => CFG.paid?.[key] || 0;

/* ---------- treasury: game coins ----------
   In:  rewards that pay coins (automatically, or after Dad approves) + coins Dad adds by hand.
   Out: withdrawals Dad approved. Everything Dad decides lives in his signed rules, so the phone cannot fake it. */
function fmtCoins(n) {
  const a = Math.abs(Math.round(n)), sg = n < 0 ? '−' : '', cut = (v, d) => String(+v.toFixed(d));
  if (a >= 1e6) return sg + cut(a / 1e6, a < 1e7 ? 2 : 1) + 'M';
  if (a >= 1e3) return sg + cut(a / 1e3, a < 1e4 ? 2 : a < 1e5 ? 1 : 0) + 'K';
  return sg + a;
}
const fullCoins = n => Math.round(n).toLocaleString('en-US');
function treasury(requests = []) {
  const hist = [], awaiting = [];
  for (const r of CFG.rewards || []) {
    const c = Math.max(0, Math.round(r.coins || 0)); if (!c) continue;
    for (const e of rewardState(r).earned) {
      if (CFG.coinNo?.[e.key]) continue;
      if (r.approve && !CFG.coinOk?.[e.key]) { awaiting.push({ key: e.key, title: r.title, label: e.label, amount: c, at: e.at || 0 }); continue; }
      hist.push({ kind: 'reward', amount: r.approve ? CFG.coinOk[e.key] : c, title: r.title, label: e.label, at: e.at || 0 });
    }
  }
  for (const b of CFG.bank || []) hist.push({ kind: 'bank', amount: b.amount, title: b.amount >= 0 ? 'From Dad' : 'Taken by Dad', label: b.note || '', at: b.at });
  const pending = [];
  for (const q of requests) {
    const d = CFG.wd?.[q.id];
    if (d) { if (d.ok) hist.push({ kind: 'wd', amount: -d.amount, title: 'Withdrawn', label: '', at: d.at, id: q.id }); }
    else if (!q.cancelled) pending.push(q);
  }
  // approvals whose request the phone no longer lists still count
  for (const [id, d] of Object.entries(CFG.wd || {})) if (d.ok && !requests.some(q => q.id === id)) hist.push({ kind: 'wd', amount: -d.amount, title: 'Withdrawn', label: '', at: d.at, id });
  hist.sort((a, b) => b.at - a.at);
  const balance = hist.reduce((a, h) => a + h.amount, 0), held = pending.reduce((a, q) => a + q.amount, 0);
  return { balance, available: balance - held, pending, awaiting, hist };
}

/* ---------- signed rules: only Dad's key can change them ---------- */
const b64 = { enc: buf => btoa(String.fromCharCode(...new Uint8Array(buf))), dec: s => Uint8Array.from(atob(s), c => c.charCodeAt(0)),
  utf8: t => { const u = new TextEncoder().encode(t); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode(...u.subarray(i, i + 0x8000)); return btoa(s); },
  text: s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, '')), c => c.charCodeAt(0))) };
const SIG = { name: 'ECDSA', namedCurve: 'P-256' }, SIGH = { name: 'ECDSA', hash: 'SHA-256' };
async function verifyRules(file, pubJwk) {                // file = {text, sig}; returns the rules or null
  try {
    const key = await crypto.subtle.importKey('jwk', pubJwk, SIG, false, ['verify']);
    const good = await crypto.subtle.verify(SIGH, key, b64.dec(file.sig), new TextEncoder().encode(file.text));
    return good ? JSON.parse(file.text) : null;
  } catch { return null; }
}

/* ---------- GitHub contents API (private data repo) ---------- */
function ghClient(get) {                                  // get() -> {owner, token, api}
  const base = p => `${(get().api || 'https://api.github.com').replace(/\/$/, '')}/repos/${get().owner}/${DATA_REPO}/contents/${p}`;
  const call = async (p, opt = {}, accept = 'application/vnd.github+json') => fetch(base(p), { cache: 'no-store', ...opt, headers: { Accept: accept, Authorization: 'Bearer ' + get().token, ...(opt.body ? { 'Content-Type': 'application/json' } : {}) } });
  return {
    async meta(p) { const r = await call(p); if (r.status === 404) return null; if (!r.ok) throw new Error('GitHub ' + r.status); return r.json(); },
    async text(p) { const m = await this.meta(p); return m ? { text: b64.text(m.content || ''), sha: m.sha } : null; },
    async blob(p) { const r = await call(p, {}, 'application/vnd.github.raw'); if (!r.ok) throw new Error('GitHub ' + r.status); return r.blob(); },
    // create or replace; finds the current sha itself and retries once if someone wrote in between
    async put(p, content64, message, sha, strict = false) {   // strict: never overwrite a newer copy from another device
      for (let attempt = 0; attempt < 2; attempt++) {
        if (sha === undefined) sha = (await this.meta(p))?.sha || null;

/* =========================================================
   Weather: realistic snow from a few slow flakes to a blizzard.
   Used by his app (full screen, behind everything) and by Dad's desk (live preview).
   ========================================================= */
const WEATHER_DEFAULT = {
  mode: 'cycle',     // 'fixed' = always `level` · 'cycle' = changes by itself between `min` and `max` · 'off'
  level: 40,         // 0–100: 0 a few lazy flakes … 100 blizzard
  min: 10, max: 100, // range for 'cycle'
  period: 8,         // minutes for one full change in 'cycle'
  wind: 35,          // 0–100: steady wind
  gusts: 50,         // 0–100: how often and how hard gusts hit
  size: 100,         // % flake size
  speed: 100,        // % falling speed
  haze: true,        // white-out haze in heavy snow
};
const WEATHER_PRESETS = [
  ['calm', 'Calm', { mode: 'fixed', level: 6, wind: 10, gusts: 10 }],
  ['light', 'Light snow', { mode: 'fixed', level: 25, wind: 25, gusts: 30 }],
  ['snow', 'Snowfall', { mode: 'fixed', level: 50, wind: 35, gusts: 45 }],
  ['heavy', 'Heavy snow', { mode: 'fixed', level: 75, wind: 55, gusts: 60 }],
  ['blizzard', 'Blizzard', { mode: 'fixed', level: 100, wind: 85, gusts: 85 }],
  ['cycle', 'Changing weather', { mode: 'cycle', min: 5, max: 100, period: 8, wind: 40, gusts: 55 }],
];
const weatherOf = w => ({ ...WEATHER_DEFAULT, ...(w || {}) });
const weatherName = l => l < 12 ? 'Calm' : l < 35 ? 'Light snow' : l < 60 ? 'Snowfall' : l < 85 ? 'Heavy snow' : 'Blizzard';
// Where 'cycle' is at a moment t (seconds): slow, irregular, with blizzards rarer than light snow
function weatherCycle(w, t) {
  const P = Math.max(1, w.period) * 60, k = 2 * Math.PI / P;
  let s = .5 + .5 * (.55 * Math.sin(k * t) + .3 * Math.sin(k * 2.73 * t + 1.7) + .15 * Math.sin(k * 6.1 * t + 4.2));
  s = Math.pow(Math.min(1, Math.max(0, s)), 1.35);
  return w.min + (w.max - w.min) * s;
}

function makeSnow(cv, getW, opts = {}) {
  const ctx = cv.getContext('2d'), still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const timeScale = opts.timeScale || 1, cap = opts.cap || 650;
  const sprite = soft => { const s = 64, c = document.createElement('canvas'); c.width = c.height = s; const g = c.getContext('2d'), gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(soft ? .25 : .55, `rgba(255,255,255,${soft ? .55 : .9})`); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, s, s); return c; };
  const SPR = [sprite(false), sprite(true)];
  let W = 0, H = 0, flakes = [], last = performance.now(), t = Math.random() * 1e4, ct = Date.now() / 1000,   // ct: weather clock, the same on every device
    raf = 0, I = -1, stopped = false;
  let gust = 0, gustT = 0, gustLen = 0, gustAmp = 0, dir = 1, nextGust = 2;
  const make = anywhere => {
    const z = Math.pow(Math.random(), 1.7), bokeh = z > .93;
    return { z, x: Math.random() * (W + 160) - 80, y: anywhere ? Math.random() * H : -14 - Math.random() * 60, bokeh,
      r: bokeh ? 6 + Math.random() * 5 : .9 + z * 3.2 + Math.random() * .6, vy: 16 + z * 78 + Math.random() * 14,
      a: bokeh ? .16 + Math.random() * .12 : .35 + z * .5 + Math.random() * .15, soft: bokeh || z > .6 ? 1 : 0,
      ph: Math.random() * 6.28, sf: .5 + Math.random() * 1.1, sa: 6 + z * 16 + Math.random() * 6, tw: Math.random() * 6.28, fi: anywhere ? 1 : 0 };
  };
  const want = () => { const area = W * H / 4200 * (opts.density || 1); return Math.min(cap, Math.round(area * (.3 + 6 * Math.pow(Math.max(0, I), 1.35)))); };
  const resize = () => {
    const d = Math.min(2, devicePixelRatio || 1), r = cv.getBoundingClientRect();
    W = opts.fixed ? r.width : innerWidth; H = opts.fixed ? r.height : innerHeight; if (!W || !H) return;
    cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0);

  };

        if (f.x < -120 || f.x > W + 120) { nf.y = Math.random() * H; nf.x = vx > 0 ? -60 - Math.random() * 40 : W + 60 + Math.random() * 40; }   // blown in from the side
        flakes[i] = nf; continue;
      }
      const x = f.x + Math.sin(t * f.sf + f.ph) * f.sa * .35 * sway, d = f.r * 2.4 * sz;

        const m = Math.hypot(vx, vy) || 1; ctx.beginPath(); ctx.moveTo(x, f.y); ctx.lineTo(x - vx / m * len, f.y - vy / m * len); ctx.stroke();

}

function tone(notes, type = 'sine', vol = .22) {

    actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume();

    }
  } catch {}
}

async function mergePool(data) {
  const mapId = new Map(words.map(w => [w.id, w]));
  let order = words.reduce((m, w) => Math.max(m, w.order || 0), 0), added = 0;
  const wPuts = [], bPuts = [];
  for (const p of data.words || []) {
    if (!p.en || !p.ru) continue;
    let w = mapId.get(p.id);
    const base = { en: p.en.trim(), ipa: (p.ipa || '').trim(), ru: p.ru.trim(), example: (p.example || '').trim(), updated: p.updated || Date.now(),
      ...(p.type === 'verb' ? { type: 'verb', past: p.past || [], pp: p.pp || [], seq: p.seq || 0, note: p.note || '' } : { type: '' }) };
    if (w) Object.assign(w, base);
    else { w = { id: p.id || uid(), ...base, order: ++order, count: 0, seen: 0, wrong: 0, learned: false, learnedAt: 0, stage: 0, nextReview: 0, lastSeen: 0 }; words.push(w); mapId.set(w.id, w); added++; }
    wPuts.push(w); if (p.image instanceof Blob) bPuts.push(['img:' + w.id, p.image]);
  }
  const m = data.media || {};
  for (const k of MEDIA_KEYS) if (m[k] instanceof Blob) bPuts.push(['media:' + k, m[k]]);
  for (const [n, b] of Object.entries(m.levels || {})) if (b instanceof Blob) bPuts.push(['media:level:' + n, b]);
  for (const [id, b] of Object.entries(m.rewards || {})) if (b instanceof Blob) bPuts.push(['media:reward:' + id, b]);
  for (const [n, b] of Object.entries(m.avatars || {})) if (b instanceof Blob) bPuts.push(['media:avatar:' + n, b]);
  await tx(['words', 'blobs'], 'readwrite', ([ws, bs]) => { wPuts.forEach(w => ws.put(w)); bPuts.forEach(([k, b]) => bs.put(b, k)); });
  bPuts.forEach(([k]) => dropURL(k));
  if (Array.isArray(m.levelNames) && m.levelNames.length === LEVELS) { LV.names = m.levelNames.map((n, i) => n || DEFAULT_LEVEL_NAMES[i]); await kvSet('levels', LV); }
  words.sort((a, b) => a.order - b.order);
  return added;
}
let syncing = false;
const headTag = h => h.headers.get('etag') || h.headers.get('last-modified') || h.headers.get('content-length') || '';
async function fetchBlob(path) { const r = await fetch(path); if (!r.ok) throw new Error(path + ' ' + r.status); return r.blob(); }
async function pooled(items, n, fn) { let i = 0; await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => { while (i < items.length) { const k = i++; await fn(items[k], k); } })); }
async function syncFromSite(manual = false) {
  if (!/^https?:$/.test(location.protocol) || syncing || sess) return;
  syncing = true;
  try {
    const h = await fetch('content/words.json', { method: 'HEAD', cache: 'no-cache' });
    if (!h.ok) { if (manual) toast('No words published yet.'); return; }
    const tag = headTag(h);
    if (tag && tag === await kvGet('siteTag')) { if (manual) toast('Already up to date.'); return; }
    const man = await (await fetch('content/words.json', { cache: 'no-cache' })).json();
    if (!man || !Array.isArray(man.words)) return;
    const src = (await kvGet('siteSrc')) || { words: {}, media: {} }, byIdLocal = new Map(words.map(w => [w.id, w]));
    const todo = [];
    for (const p of man.words) {
      if (!p.en || !p.ru) continue;
      const w = byIdLocal.get(p.id), imgChanged = !!p.image && (!w || src.words[p.id] !== p.image);
      if (!w || imgChanged || (w.updated || 0) !== (p.updated || 0)) todo.push({ p, imgChanged });
    }
    const m = man.media || {}, mOut = { levels: {}, rewards: {}, avatars: {} }, jobs = [];
    const want = (key, path, put) => { if (path && src.media[key] !== path) jobs.push([key, path, put]); };
    for (const k of MEDIA_KEYS) want(k, m[k], b => mOut[k] = b);
    for (const [n, p] of Object.entries(m.levels || {})) want('level:' + n, p, b => mOut.levels[n] = b);
    for (const [id, p] of Object.entries(m.rewards || {})) want('reward:' + id, p, b => mOut.rewards[id] = b);
    for (const [n, p] of Object.entries(m.avatars || {})) want('avatar:' + n, p, b => mOut.avatars[n] = b);
    const total = todo.filter(t => t.imgChanged).length + jobs.length; let done = 0;
    const tick = () => total && toast(`Loading… ${done}/${total}`, 60000); tick();
    await pooled(todo, 6, async t => { if (t.imgChanged) { t.p = { ...t.p, imagePath: t.p.image, image: await fetchBlob(t.p.image) }; done++; tick(); } else t.p = { ...t.p, image: null }; });
    await pooled(jobs, 3, async ([k, path, put]) => { put(await fetchBlob(path)); done++; tick(); });
    mOut.levelNames = m.levelNames;
    const added = await mergePool({ words: todo.map(t => t.p), media: mOut });
    // Dad's list is the truth: items he deleted in Studio leave this phone too
    const keep = new Set(man.words.map(p => p.id)), gone = words.filter(w => !keep.has(w.id));
    if (gone.length) { await tx(['words', 'blobs'], 'readwrite', ([ws, bs]) => gone.forEach(w => { ws.delete(w.id); bs.delete('img:' + w.id); })); words = words.filter(w => keep.has(w.id)); gone.forEach(w => { dropURL('img:' + w.id); delete src.words[w.id]; }); }
    for (const t of todo) if (t.p.imagePath) src.words[t.p.id] = t.p.imagePath;
    for (const [k, path] of jobs) src.media[k] = path;
    AV = Object.keys(m.avatars || {}).sort((a, b) => a - b); await kvSet('avatars', AV);
    await kvSet('siteSrc', src); await kvSet('siteTag', tag);
    toast(added ? `${added} new item${added === 1 ? '' : 's'} loaded` : 'Updated', 3000); render();
  } catch (err) { console.warn('site sync skipped', err); if (manual) toast('Could not reach the site.'); }
  finally { syncing = false; }
}

   ========================================================= */
const gh = ghClient(() => LINK);
async function takeLinkFromURL() {                        // #link=<base64 {o: owner, t: token, k: public key}> opened once on this phone
  const m = /[#&]link=([^&]+)/.exec(location.hash); if (!m) return;
  try {
    const j = JSON.parse(b64.text(decodeURIComponent(m[1]).replace(/-/g, '+').replace(/_/g, '/')));
    if (!j.o || !j.t || !j.k) throw 0;
    LINK = { owner: j.o, token: j.t, pub: j.k, ...(j.a ? { api: j.a } : {}) }; await kvSet('link', LINK);
    await kvSet('shas', {}); toast('Linked to Dad ✓', 4000);
  } catch { toast('That link is not valid.', 4000); }
  history.replaceState(null, '', location.pathname + location.search);   // the key must not stay in the address bar
}
async function pullRules() {
  const f = await gh.text('rules.json'); if (!f) return;
  let file; try { file = JSON.parse(f.text); } catch { file = null; }
  const cfg = file && await verifyRules(file, LINK.pub);
  if (!cfg) { if (!EV.some(e => e.kind === 'tamper' && Date.now() - e.t < DAY)) logEvent('tamper'); return; }   // not signed by Dad: ignore it
  if ((cfg.v || 0) < (CFG.v || 0)) { if (!EV.some(e => e.kind === 'rollback' && Date.now() - e.t < DAY)) logEvent('rollback'); return; }   // an older copy put back
  const changed = cfg.v !== CFG.v;
  CFG = { ...structuredClone(CFG_DEFAULT), ...cfg }; await kvSet('cfg', CFG);
  const src = (await kvGet('rewSrc')) || {};
  for (const r of CFG.rewards) if (r.anim && src[r.id] !== r.anim) {
    try { const b = await gh.blob(r.anim); await tx('blobs', 'readwrite', st => { st.put(b, 'media:reward:' + r.id); }); dropURL('media:reward:' + r.id); src[r.id] = r.anim; } catch {}
  }
  await kvSet('rewSrc', src);
  if (changed && !sess) { render(); noticeDecisions(); }
}
async function pushLog() {
  const shas = (await kvGet('shas')) || {}, months = [...new Set(LOG.filter(x => !x.synced).map(x => x.day.slice(0, 7)))];
  for (const m of months) {
    const path = `log/sessions-${m}.json`, list = LOG.filter(x => x.day.startsWith(m)).map(({ synced, ...x }) => x);
    shas[path] = await gh.put(path, b64.utf8(JSON.stringify(list, null, 1)), `sessions ${m}`, shas[path] || undefined);
    LOG.forEach(x => { if (x.day.startsWith(m)) x.synced = true; });
    await kvSet('sessions', LOG); await kvSet('shas', shas);
  }
  const state = { v: 1, updated: Date.now(), tz: new Date().getTimezoneOffset(), app: APP_VERSION, cfgV: CFG.v || 0, learned: learnedCount(), peak: peakLearned(), verbs: verbLearned(), vpeak: peakVerbs(), verbTotal: verbList().length,
    items: words.map(w => ({ id: w.id, en: w.en, ...(isVerb(w) ? { verb: 1 } : {}), count: w.count || 0, learned: !!w.learned, seen: w.seen || 0, wrong: w.wrong || 0, lastSeen: w.lastSeen || 0 })), events: EV.slice(-300), requests: REQ.slice(-200), coins: treasury(REQ).balance };
  const sig = JSON.stringify([JSON.stringify(state.requests), state.learned, state.peak, state.verbs, state.vpeak, state.cfgV, state.items.map(i => [i.count, i.learned, i.seen, i.wrong]), EV.length]);
  if (months.length || sig !== await kvGet('stateSig')) { shas['log/state.json'] = await gh.put('log/state.json', b64.utf8(JSON.stringify(state)), 'state', shas['log/state.json'] || undefined); await kvSet('shas', shas); await kvSet('stateSig', sig); }
}
let syncBusy = false;
async function syncData() {                               // safe to call any time; quietly does nothing offline
  if (!LINK || syncBusy || sess) return;
  syncBusy = true;
  try { await pullRules(); await pushLog(); SYNC = { at: Date.now(), err: '' }; }
  catch (e) { SYNC = { at: SYNC.at, err: String(e.message || e).slice(0, 60) }; console.warn('sync', e); }
  finally { syncBusy = false; if (tab === 'settings' && !sess) renderSettings(); }
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const t = e.target;
  const tb = t.closest('#tabbar button'); if (tb) return go(tb.dataset.tab);
  const g = t.closest('[data-go]'); if (g) return go(g.dataset.go);
  const f = t.closest('[data-filter]'); if (f) { wordFilter = f.dataset.filter; return renderWords(); }
  const k = t.closest('[data-k]'); if (k) return pressKey(k.dataset.k);
  const el = t.closest('[data-action]'), a = el?.dataset.action; if (!a) return;
  const c = sess?.cur;
  switch (a) {
    case 'start': return startSession(el.dataset.mode);
    case 'avatar': return openAvatarPicker();
    case 'bank': return openBank();
    case 'opt': return chooseOpt(el.dataset.i);
    case 'vopt': return chooseVerb(el.dataset.i);
    case 'vfield': if (c?.phase === 'test' && c.test === 'verb') { c.fi = +el.dataset.i; drawVerb(); } return;
    case 'check': return check();
    case 'say': return speak(c?.w.en);
    case 'vsay': { const v = byId(el.dataset.id); return v && speak(`${v.en}, ${v.past.join(' or ')}, ${v.pp.join(' or ')}`); }
    case 'vset': vSet = +el.dataset.i; return renderVerbs();
    case 'tile': { if (c?.phase !== 'test') return; const tl = c.tiles[el.dataset.i]; if (tl.used) return; tl.used = true; c.built.push(tl.i); sfx.key(); return drawOrder(); }
    case 'untile': { if (c?.phase !== 'test') return; const ix = c.built.splice(el.dataset.n, 1)[0]; c.tiles[ix].used = false; return drawOrder(); }
    case 'next': if (c?.phase !== 'result') return; return sess.remaining <= 0 ? finishSession(true) : nextCard();
    case 'quit': if (await confirmDlg('Quit this session?', 'A session only counts if you finish the timer.', 'Quit')) finishSession(false); return;
    case 'voice-test': return speak('Fresh powder today. Try not to fall.');
    case 'update': await syncFromSite(true); await syncData(); return renderSettings();
  }
});
document.addEventListener('change', e => { if (e.target.id === 's-voice') { S.voiceURI = e.target.value; kvSet('settings', S); speak('Hello from the lodge.'); } });
// physical keyboard (PC testing); paste is ignored because there is no text field at all
document.addEventListener('keydown', e => {
  if (!sess || sess.cur?.phase !== 'test' || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Enter') return check();
  if (e.key === 'Backspace') return pressKey('back');
  if (/^[a-zA-Z0-9' -]$/.test(e.key)) pressKey(e.key.toLowerCase());
});

/* ---------- boot ---------- */
(async function boot() {
  db = await openDB();
  words = ((await tx('words', 'readonly', s => s.getAll())) || []).sort((a, b) => a.order - b.order);
  S = { ...DEFAULTS, ...((await kvGet('settings')) || {}) };
  CFG = { ...structuredClone(CFG_DEFAULT), ...((await kvGet('cfg')) || {}) };
  LOG = (await kvGet('sessions')) || []; EV = (await kvGet('events')) || [];
  LV = { names: DEFAULT_LEVEL_NAMES.slice(), ...((await kvGet('levels')) || {}) };
  PEAK = (await kvGet('peak')) || 0; VPEAK = (await kvGet('vpeak')) || 0; LINK = (await kvGet('link')) || null; AV = (await kvGet('avatars')) || []; REQ = (await kvGet('requests')) || [];
  await takeLinkFromURL();
  render(); snow();
  if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  syncFromSite(); syncData();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { syncFromSite(); syncData(); if (!sess) render(); } });
  window.addEventListener('online', syncData);
  setInterval(() => { if (!sess && tab === 'home' && !document.hidden) renderHome(); }, 60000);   // slot status follows the clock
})();

</script>
